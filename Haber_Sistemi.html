<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News - Yapay Zeka Haberleri</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* --- SİYAH HEADER & TOP-BAR SABİTLEME --- */
        header,
        .top-bar {
            background-color: #000000 !important;
        }

        /* Genel yazıların beyaz kalması (Kur renklerine dokunmadan) */
        header .logo,
        header .pill,
        header .search-icon,
        header .icon-button,
        .top-bar .currency-label,
        .top-bar .live-indicator span {
            color: #ffffff !important;
        }

        /* --- KUR RENKLERİNİ KORUMA --- */
        /* Bu kısım yeşil (up) ve kırmızı (down) renklerin ezilmesini engeller */
        .currency-up {
            color: var(--accent-green) !important;
        }

        .currency-down {
            color: var(--accent-red) !important;
        }

        /* Arama kutusu ve butonların siyah zemine uyumu */
        header .search-input {
            background: #1a1a1a !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
        }

        header .pill:not(.active) {
            background: #1a1a1a !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-blue: #00d4ff;
            --accent-purple: #9d4edd;
            --accent-green: #00ff88;
            --accent-red: #ff4d6d;
            --accent-yellow: #ffd23f;
            --border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0a0a0a;
            --text-secondary: #6c757d;
            --border: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            background-image: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)"/></svg>');
            z-index: 9999;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Top Bar */
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
            font-size: 0.85rem;
        }

        .top-bar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .currency-ticker {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .currency-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Space Mono', monospace;
        }

        .currency-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .currency-value {
            font-weight: 700;
        }

        .currency-up {
            color: var(--accent-green);
        }

        .currency-down {
            color: var(--accent-red);
        }

        .top-bar-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        /* Header */
        header {
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            animation: slideDown 0.6s ease-out;
        }

        [data-theme="light"] header {
            background: rgba(248, 249, 250, 0.95);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        /* Search Bar */
        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-results {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .search-result-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .search-result-item:hover {
            background: var(--bg-secondary);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .search-result-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Header Actions */
        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-primary);
        }

        .icon-button:hover {
            background: var(--bg-secondary);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .nav-pills {
            display: flex;
            gap: 0.5rem;
        }

        .pill {
            padding: 0.5rem 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .pill:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .pill.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border-color: transparent;
        }

        /* Hero Section */
        .hero {
            padding: 3rem 0 2rem;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .hero-content p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        /* Featured News */
        .featured-section {
            padding: 2rem 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .view-all {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: gap 0.3s ease;
        }

        .view-all:hover {
            gap: 1rem;
        }

        .featured-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 2rem;
        }

        .featured-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.15);
            border-color: var(--accent-blue);
        }

        .featured-image {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            padding: 3rem;
        }

        .featured-content {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .featured-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .featured-card h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .featured-card p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            padding: 2rem 0;
        }

        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(0, 212, 255, 0.05));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .news-card:hover::before {
            opacity: 1;
        }

        .news-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-blue);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .category-tag {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-blue);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .date {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .news-card h3 {
            font-size: 1.35rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
            font-weight: 700;
        }

        .news-card p {
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-blue);
            font-weight: 500;
            font-size: 0.9rem;
            transition: gap 0.3s ease;
        }

        .news-card:hover .read-more {
            gap: 1rem;
        }

        .read-more::after {
            content: '→';
            font-size: 1.2rem;
        }

        .card-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* Newsletter */
        .newsletter-section {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 24px;
            padding: 3rem;
            margin: 4rem 0;
            text-align: center;
        }

        .newsletter-section h2 {
            font-size: 2.25rem;
            margin-bottom: 0.75rem;
            color: white;
        }

        .newsletter-section p {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .newsletter-form {
            display: flex;
            gap: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .newsletter-input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            outline: none;
        }

        .newsletter-button {
            padding: 1rem 2rem;
            background: white;
            color: var(--accent-purple);
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
        }

        .newsletter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Footer */
        footer {
            padding: 3rem 0 2rem;
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }

        .footer-simple {
            text-align: center;
            padding: 2rem 0;
        }

        .footer-logo-section {
            max-width: 600px;
            margin: 0 auto;
        }

        .footer-bottom {
            padding-top: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }

            .featured-card {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .top-bar-content {
                flex-direction: column;
                gap: 1rem;
            }

            .currency-ticker {
                flex-wrap: wrap;
                justify-content: center;
            }

            .header-content {
                flex-wrap: wrap;
            }

            .search-container {
                order: 3;
                max-width: 100%;
                width: 100%;
            }

            .hero-content h1 {
                font-size: 2.25rem;
            }

            .hero-stats {
                grid-template-columns: 1fr;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            .nav-pills {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .nav-pills::-webkit-scrollbar {
                display: none;
            }

            .newsletter-form {
                flex-direction: column;
            }
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        /* 1. ÖNCE: Üst bar ve genel yazıları beyaza sabitle (Tarih dahil) */
        .top-bar,
        .top-bar span,
        .top-bar-right,
        .top-bar-right span,
        .live-indicator span {
            color: #ffffff !important;
        }

        /* 2. SONRA: Kur renklerini "ZIRHLI" hale getir (Diğer her şeyi ezsin) */
        .currency-up,
        .currency-item .currency-up {
            color: var(--accent-green) !important;
        }

        .currency-down,
        .currency-item .currency-down {
            color: var(--accent-red) !important;
        }
    </style>
</head>

            {
                id: 7,
                title: "Meta'nın Yeni AI Asistanı Milyonlarca Kullanıcıya Ulaştı",
                description: "Meta AI, sosyal medya platformlarında entegre edilerek günlük kullanım rekorları kırıyor.",
                category: "Teknoloji",
                date: "27 Ocak 2026",
                views: "13.9K",
                readTime: "4 dk"
            },
            {
                id: 8,
                title: "Eğitimde Yapay Zeka: Kişiselleştirilmiş Öğrenme Dönemi",
                description: "AI destekli eğitim platformları, her öğrenciye özel öğrenme yolları oluşturarak başarı oranlarını artırıyor.",
                category: "Eğitim",
                date: "26 Ocak 2026",
                views: "7.2K",
                readTime: "6 dk"
            }
        ];

        const categories = ["Tümü", "Model", "Teknoloji", "Politika", "Otonom", "Sağlık", "Hukuk", "Eğitim"];

        function App() {
            const mainSectionRef = useRef(null);
            const [news, setNews] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeCategory, setActiveCategory] = useState("Tümü");
            const [searchQuery, setSearchQuery] = useState("");
            const [showSearchResults, setShowSearchResults] = useState(false);
            const [theme, setTheme] = useState("dark");
            const [currencies, setCurrencies] = useState({
                usd: { value: 33.45, change: 0.12 },
                eur: { value: 36.78, change: -0.08 },
                btc: { value: 98450, change: 2.34 }
            });
            const searchRef = useRef(null);

            // Kategori değiştiğinde aşağı kaydırma efekti
            useEffect(() => {
                if (activeCategory !== "Tümü" && mainSectionRef.current) {
                    mainSectionRef.current.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            }, [activeCategory]);

            // Veri yükleme, kur güncelleme ve tema efekti
            useEffect(() => {
                setTimeout(() => {
                    setNews(mockNews);
                    setLoading(false);
                }, 1000);

                const currencyInterval = setInterval(() => {
                    setCurrencies(prev => ({
                        usd: {
                            value: +(prev.usd.value + (Math.random() - 0.5) * 0.1).toFixed(2),
                            change: +(Math.random() - 0.5).toFixed(2)
                        },
                        eur: {
                            value: +(prev.eur.value + (Math.random() - 0.5) * 0.1).toFixed(2),
                            change: +(Math.random() - 0.5).toFixed(2)
                        },
                        btc: {
                            value: Math.floor(prev.btc.value + (Math.random() - 0.5) * 100),
                            change: +(Math.random() * 5 - 2.5).toFixed(2)
                        }
                    }));
                }, 5000);

                document.documentElement.setAttribute('data-theme', theme);

                const handleClickOutside = (event) => {
                    if (searchRef.current && !searchRef.current.contains(event.target)) {
                        setShowSearchResults(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);

                return () => {
                    clearInterval(currencyInterval);
                    document.removeEventListener('mousedown', handleClickOutside);
                };
            }, [theme]);
            const filteredNews = activeCategory === "Tümü"
                ? news
                : news.filter(item => item.category === activeCategory);

            const searchResults = searchQuery.length > 0
                ? news.filter(item =>
                    item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.description.toLowerCase().includes(searchQuery.toLowerCase())
                )
                : [];

            const featuredNews = news.find(item => item.featured);

            const toggleTheme = () => {
                setTheme(prev => prev === "dark" ? "light" : "dark");
            };

            return (
                <>
                    {/* Top Bar */}
                    <div className="top-bar">
                        <div className="container">
                            <div className="top-bar-content">
                                <div className="currency-ticker">
                                    <div className="currency-item">
                                        <span className="currency-label">USD/TRY</span>
                                        <span className={`currency-value ${currencies.usd.change >= 0 ? 'currency-up' : 'currency-down'}`}>
                                            ₺{currencies.usd.value.toFixed(2)}
                                        </span>
                                        <span style={{ fontSize: '0.75rem', color: currencies.usd.change >= 0 ? 'var(--accent-green)' : 'var(--accent-red)' }}>
                                            {currencies.usd.change >= 0 ? '↑' : '↓'} {Math.abs(currencies.usd.change)}%
                                        </span>
                                    </div>
                                    <div className="currency-item">
                                        <span className="currency-label">EUR/TRY</span>
                                        <span className={`currency-value ${currencies.eur.change >= 0 ? 'currency-up' : 'currency-down'}`}>
                                            ₺{currencies.eur.value.toFixed(2)}
                                        </span>
                                        <span style={{ fontSize: '0.75rem', color: currencies.eur.change >= 0 ? 'var(--accent-green)' : 'var(--accent-red)' }}>
                                            {currencies.eur.change >= 0 ? '↑' : '↓'} {Math.abs(currencies.eur.change)}%
                                        </span>
                                    </div>
                                    <div className="currency-item">
                                        <span className="currency-label">BTC/USD</span>
                                        <span className={`currency-value ${currencies.btc.change >= 0 ? 'currency-up' : 'currency-down'}`}>
                                            ${currencies.btc.value.toLocaleString()}
                                        </span>
                                        <span style={{ fontSize: '0.75rem', color: currencies.btc.change >= 0 ? 'var(--accent-green)' : 'var(--accent-red)' }}>
                                            {currencies.btc.change >= 0 ? '↑' : '↓'} {Math.abs(currencies.btc.change)}%
                                        </span>
                                    </div>
                                </div>
                                <div className="top-bar-right">
                                    <div className="live-indicator">
                                        <div className="live-dot"></div>
                                        <span>CANLI</span>
                                    </div>
                                    <span>{new Date().toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Header */}
                    <header>
                        <div className="container">
                            <div className="header-content">
                                <div className="logo-section">
                                    <div className="logo">AI NEWS</div>
                                </div>

                                {/* Search */}
                                <div className="search-container" ref={searchRef}>
                                    <div className="search-wrapper">
                                        <span className="search-icon">🔍</span>
                                        <input
                                            type="text"
                                            className="search-input"
                                            placeholder="Haberlerde ara..."
                                            value={searchQuery}
                                            onChange={(e) => {
                                                setSearchQuery(e.target.value);
                                                setShowSearchResults(e.target.value.length > 0);
                                            }}
                                        />
                                        {showSearchResults && searchResults.length > 0 && (
                                            <div className="search-results">
                                                {searchResults.slice(0, 5).map(result => (
                                                    <div key={result.id} className="search-result-item" onClick={() => {
                                                        setSearchQuery("");
                                                        setShowSearchResults(false);
                                                    }}>
                                                        <div className="search-result-title">{result.title}</div>
                                                        <div className="search-result-desc">{result.description.substring(0, 80)}...</div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Header Actions */}
                                <div className="header-actions">
                                    <button className="icon-button" onClick={toggleTheme} title="Tema Değiştir">
                                        {theme === 'dark' ? '☀️' : '🌙'}
                                    </button>
                                    <button className="icon-button" title="Bildirimler">
                                        🔔
                                    </button>
                                    <button className="icon-button" title="Favoriler">
                                        ⭐
                                    </button>
                                </div>
                            </div>

                            {/* Categories */}
                            <nav className="nav-pills" style={{ marginTop: '1.5rem' }}>
                                {categories.map(cat => (
                                    <button
                                        key={cat}
                                        className={`pill ${activeCategory === cat ? 'active' : ''}`}
                                        onClick={() => setActiveCategory(cat)}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main style={{ scrollMarginTop: '100px' }}>
                        <div className="container">
                            {/* Hero Section */}
                            <section className="hero">
                                <div className="hero-grid">
                                    <div className="hero-content">
                                        <h1>
                                            Yapay Zeka Dünyasından<br />
                                            <span className="gradient-text">En Son Haberler</span>
                                        </h1>
                                        <p>
                                            AI teknolojilerindeki son gelişmeleri, yenilikleri ve trendleri takip edin.
                                            Güncel haberlerle yapay zeka dünyasından haberdar olun. Her gün yeni içerikler.
                                        </p>
                                    </div>
                                    <div className="hero-stats">
                                        <div className="stat-item">
                                            <div className="stat-number">250+</div>
                                            <div className="stat-label">Günlük Haber</div>
                                        </div>
                                        <div className="stat-item">
                                            <div className="stat-number">50K+</div>
                                            <div className="stat-label">Okuyucu</div>
                                        </div>
                                        <div className="stat-item">
                                            <div className="stat-number">24/7</div>
                                            <div className="stat-label">Canlı Takip</div>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* Featured News */}
                            {featuredNews && !loading && (
                                <section className="featured-section" ref={mainSectionRef} style={{ scrollMarginTop: '120px' }}>
                                    <div className="section-header">
                                        <h2 className="section-title">🔥 Öne Çıkan Haber</h2>
                                    </div>
                                    <div className="featured-card">
                                        <div className="featured-image">
                                            🤖
                                        </div>
                                        <div className="featured-content">
                                            <div className="featured-meta">
                                                <span className="category-tag">{featuredNews.category}</span>
                                                <span className="date">{featuredNews.date}</span>
                                            </div>
                                            <h2>{featuredNews.title}</h2>
                                            <p>{featuredNews.description}</p>
                                            <div className="card-footer">
                                                <span className="read-more">Devamını Oku</span>
                                                <div className="card-stats">
                                                    <span className="stat">👁️ {featuredNews.views}</span>
                                                    <span className="stat">⏱️ {featuredNews.readTime}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            )}

                            {/* News Grid */}
                            {loading ? (
                                <div className="loading">
                                    <div className="spinner"></div>
                                </div>
                            ) : filteredNews.length > 0 ? (
                                <>
                                    <div className="section-header" style={{ marginTop: '3rem' }}>
                                        <h2 className="section-title">📰 Tüm Haberler</h2>
                                        <a href="#" className="view-all">Tümünü Gör →</a>
                                    </div>
                                    <div className="news-grid">
                                        {filteredNews.filter(item => !item.featured).map((item, index) => (
                                            <article
                                                key={item.id}
                                                className="news-card"
                                                style={{
                                                    animationDelay: `${index * 0.1}s`
                                                }}
                                            >
                                                <div className="card-header">
                                                    <span className="category-tag">{item.category}</span>
                                                    <span className="date">{item.date}</span>
                                                </div>
                                                <h3>{item.title}</h3>
                                                <p>{item.description}</p>
                                                <div className="card-footer">
                                                    <span className="read-more">Devamını Oku</span>
                                                    <div className="card-stats">
                                                        <span className="stat">👁️ {item.views}</span>
                                                        <span className="stat">⏱️ {item.readTime}</span>
                                                    </div>
                                                </div>
                                            </article>
                                        ))}
                                    </div>
                                </>
                            ) : (
                                <div className="no-results">
                                    <h3>Haber Bulunamadı</h3>
                                    <p>Bu kategoride henüz haber bulunmuyor.</p>
                                </div>
                            )}

                            {/* Newsletter */}
                            <section className="newsletter-section">
                                <h2>🚀 Projeyi Geliştirmeye Devam Ediyoruz</h2>
                                <p>
                                    Bu site sürekli güncelleniyor! Yeni özellikler ve gerçek AI haberlerini eklemek için çalışıyoruz.
                                    Geri bildirimlerinizi bizimle paylaşın.
                                </p>
                                <form className="newsletter-form" onSubmit={(e) => {
                                    e.preventDefault();
                                    alert('Teşekkürler! Mesajınız alındı.');
                                }}>
                                    <input
                                        type="email"
                                        className="newsletter-input"
                                        placeholder="Görüş ve önerileriniz için e-posta"
                                        required
                                    />
                                    <button type="submit" className="newsletter-button">
                                        Gönder
                                    </button>
                                </form>
                            </section>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer>
                        <div className="container">
                            <div className="footer-simple">
                                <div className="footer-logo-section">
                                    <div className="logo" style={{ fontSize: '1.75rem', marginBottom: '0.75rem' }}>AI NEWS</div>
                                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.95rem', lineHeight: '1.6', maxWidth: '500px' }}>
                                        Yapay zeka teknolojilerindeki gelişmeleri takip eden öğrenci projesi.
                                        Bu site eğitim amaçlı geliştirilmiştir.
                                    </p>
                                </div>
                            </div>
                            <div className="footer-bottom">
                                <p>© 2026 AI News • Okul Projesi • Eğitim Amaçlıdır</p>
                            </div>
                        </div>
                    </footer>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
